<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="860" height="190">

  <!-- Background -->
  <rect width="860" height="190" fill="#09090b"/>

  <!-- Top rule -->
  <line x1="40" y1="40" x2="820" y2="40" stroke="#ffffff" stroke-width="0.5" opacity="0.10"/>

  <!-- Left accent bar -->
  <rect x="40" y="52" width="3" height="84" fill="#58A6FF"/>

  <!-- Name — Georgia serif, editorial weight -->
  <text
    x="58" y="115"
    font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif"
    font-size="62"
    font-weight="400"
    fill="#e6edf3"
    letter-spacing="-1.5">Adrian Radulescu</text>

  <!-- Role — monospace, spaced caps -->
  <text
    x="60" y="139"
    font-family="'Courier New', Consolas, 'Lucida Console', monospace"
    font-size="11"
    fill="#58A6FF"
    letter-spacing="6"
    opacity="0.80">SOFTWARE DEVELOPER  ·  BUCURESTI, ROMANIA</text>

  <!-- Bottom rule -->
  <line x1="40" y1="154" x2="820" y2="154" stroke="#ffffff" stroke-width="0.5" opacity="0.10"/>

</svg>
