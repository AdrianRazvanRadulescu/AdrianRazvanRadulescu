  <!-- Orbital rings — very subtle -->
  <ellipse cx="430" cy="130" rx="400" ry="108" fill="none" stroke="#4a9eff" stroke-width="0.5" opacity="0.07"/>
  <ellipse cx="430" cy="130" rx="310" ry="78"  fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.05"/>

  <!-- Name — light, spaced, with glow -->
  <text x="430" y="116"
    font-family="'Helvetica Neue', Helvetica, 'Arial', sans-serif"
