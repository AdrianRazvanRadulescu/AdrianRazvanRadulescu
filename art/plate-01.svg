<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 588" width="880" height="588" role="img" aria-labelledby="plTitle plDesc">
<title id="plTitle">Astrolabe plate cut for Bucuresti, with a register of what it was cut to read</title>
<desc id="plDesc">An engraved astronomical plate, ink on cream paper, drawn for the latitude of Bucuresti. Seventeen almucantar circles every five degrees of altitude, eleven azimuth arcs every fifteen degrees, the horizon, the astronomical twilight arc at minus eighteen degrees, the twelve unequal hours of the night, the tropics with the celestial equator, a degree scale around the limb, and an off-centre ecliptic divided into the twelve signs. Beside it a register headed CUT TO READ lists appointments, identities, packets, tokens, tables and heartbeats, each against the repository it belongs to. A note reads: everything below the horizon is still computed, you just cannot see it from here.</desc>

<defs>
  <radialGradient id="toning" gradientUnits="userSpaceOnUse" cx="440" cy="294" r="530"
      gradientTransform="translate(440 294) scale(1 .66) translate(-440 -294)">
    <stop offset=".5" stop-color="#7A6746" stop-opacity="0"/>
    <stop offset="1" stop-color="#7A6746" stop-opacity=".27"/>
  </radialGradient>

  <radialGradient id="vellum" gradientUnits="userSpaceOnUse" cx="240" cy="198" r="238">
    <stop offset="0" stop-color="#F8F3E8"/>
    <stop offset=".62" stop-color="#F1EADB"/>
    <stop offset="1" stop-color="#E8DFCB"/>
  </radialGradient>

  <clipPath id="limb"><circle cx="282" cy="242" r="170.63"/></clipPath>
  <clipPath id="sky"><circle cx="282" cy="127.74" r="160"/></clipPath>

  <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.55" intercept="0"/></feComponentTransfer>
  </filter>

  <filter id="tooth" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" seed="5" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.5" intercept="0"/></feComponentTransfer>
  </filter>
</defs>

<!-- plate paper: opaque and warm, so the file reads the same on GitHub light and dark -->
<rect width="880" height="588" fill="#EFE8D9"/>
<rect width="880" height="588" fill="#EFE8D9" filter="url(#mottle)" opacity=".05"/>
<rect width="880" height="588" fill="url(#toning)"/>

<!-- the plate. pole of the world lands at (238, 266) on the sheet -->
<g transform="translate(238 266) scale(1.06) translate(-282 -242)">

  <circle cx="282" cy="242" r="185" fill="url(#vellum)"/>

  <g clip-path="url(#limb)">

    <!-- almucantars: circles of equal altitude every 5 degrees, converging on the zenith -->
    <g clip-path="url(#sky)" fill="none" stroke="#4A6273" stroke-width=".8" opacity=".45">
      <circle cx="282" cy="140.39" r="141.74"/>
      <circle cx="282" cy="150.45" r="126.25"/>
      <circle cx="282" cy="158.58" r="112.83"/>
      <circle cx="282" cy="165.24" r="101.00"/>
      <circle cx="282" cy="170.75" r="90.42"/>
      <circle cx="282" cy="175.35" r="80.83"/>
      <circle cx="282" cy="179.20" r="72.04"/>
      <circle cx="282" cy="182.43" r="63.89"/>
      <circle cx="282" cy="185.16" r="56.28"/>
      <circle cx="282" cy="187.44" r="49.11"/>
      <circle cx="282" cy="189.35" r="42.29"/>
      <circle cx="282" cy="190.93" r="35.76"/>
      <circle cx="282" cy="192.21" r="29.47"/>
      <circle cx="282" cy="193.22" r="23.36"/>
      <circle cx="282" cy="193.99" r="17.40"/>
      <circle cx="282" cy="194.53" r="11.54"/>
      <circle cx="282" cy="194.85" r="5.75"/>
    </g>

    <!-- azimuths every 15 degrees, every one passing through zenith and nadir -->
    <g clip-path="url(#sky)" fill="none" stroke="#4A6273" stroke-width=".8" opacity=".4">
      <circle cx="867.30" cy="351.78" r="605.95"/>
      <circle cx="553.64" cy="351.78" r="313.66"/>
      <circle cx="438.83" cy="351.78" r="221.79"/>
      <circle cx="372.55" cy="351.78" r="181.09"/>
      <circle cx="324.02" cy="351.78" r="162.36"/>
      <circle cx="282.00" cy="351.78" r="156.83"/>
      <circle cx="239.98" cy="351.78" r="162.36"/>
      <circle cx="191.45" cy="351.78" r="181.09"/>
      <circle cx="125.17" cy="351.78" r="221.79"/>
      <circle cx="10.36" cy="351.78" r="313.66"/>
      <circle cx="-303.30" cy="351.78" r="605.95"/>
    </g>

    <!-- the unequal hours of the night, struck through their construction points -->
    <path fill="none" stroke="#6E6558" stroke-width=".8" opacity=".55" d="M451.71 224.29A176.00 176.00 0 0 1 341.51 285.17M448.10 281.06A202.19 202.19 0 0 1 332.36 295.56M426.03 333.49A249.59 249.59 0 0 1 321.42 304.05M387.95 375.75A351.40 351.40 0 0 1 309.08 310.34M338.09 403.15A673.75 673.75 0 0 1 295.79 314.21M225.91 403.15A673.75 673.75 0 0 0 268.21 314.21M176.05 375.75A351.40 351.40 0 0 0 254.92 310.34M137.97 333.49A249.59 249.59 0 0 0 242.58 304.05M115.90 281.06A202.19 202.19 0 0 0 231.64 295.56M112.29 224.29A176.00 176.00 0 0 0 222.49 285.17"/>

    <path d="M282 71.4V412.6" fill="none" stroke="#4A6273" stroke-width=".8" opacity=".5"/>

    <!-- astronomical twilight, -18 degrees -->
    <circle cx="282" cy="37.43" r="272.44" fill="none" stroke="#A8702A" stroke-width="1.15" stroke-dasharray="3 4.5" opacity=".78"/>

    <!-- horizon: centre offset 112 cot(44.4268), radius 112 / sin(44.4268) -->
    <circle cx="282" cy="127.74" r="160" fill="none" stroke="#2E5570" stroke-width="1.6" opacity=".9"/>
  </g>

  <!-- tropic of Cancer 112 tan(33.28), celestial equator dashed at 112 -->
  <g fill="none" stroke="#6E6558" opacity=".55">
    <circle cx="282" cy="242" r="73.52" stroke-width="1"/>
    <circle cx="282" cy="242" r="112" stroke-width="1" stroke-dasharray="2.5 3.5"/>
  </g>

  <!-- degree scale. pathLength 360 on a path, not a circle, so the dash arithmetic reads in degrees everywhere -->
  <g fill="none">
    <path d="M107.5 242a174.5 174.5 0 1 0 349 0a174.5 174.5 0 1 0-349 0" stroke="#6E6558" stroke-width="6" stroke-dasharray="0.34 4.66" stroke-dashoffset="0.17" pathLength="360" opacity=".55"/>
    <path d="M105 242a177 177 0 1 0 354 0a177 177 0 1 0-354 0" stroke="#2B2620" stroke-width="11" stroke-dasharray="0.5 29.5" stroke-dashoffset="0.25" pathLength="360" opacity=".62"/>
  </g>
  <g fill="none" stroke="#2B2620">
    <circle cx="282" cy="242" r="170.63" stroke-width="1.6" opacity=".88"/>
    <circle cx="282" cy="242" r="183" stroke-width=".9" opacity=".62"/>
  </g>

  <!-- the rete: ecliptic and the twelve signs, tangent inside both tropics -->
  <g clip-path="url(#limb)" fill="none" stroke="#A8702A">
    <circle cx="254.15" cy="202.22" r="122.07" stroke-width="1.25" opacity=".88"/>
    <path stroke-width="1.1" opacity=".78" d="M373.75 177.76L379.62 176.56M372.85 230.70L378.69 232.10M354.08 272.33L359.00 275.77M324.17 302.22L327.61 307.14M285.85 320.11L287.40 325.90M240.31 323.51L239.63 329.47M190.25 306.24L187.11 311.35M146.03 258.91L140.72 261.70M134.15 179.79L128.26 178.69M184.13 102.23L180.69 97.31M274.11 81.79L275.09 75.87M344.39 120.02L348.83 115.98"/>
  </g>

  <!-- zenith, the cardinal points where the horizon crosses the equator, the pole -->
  <path d="M274 194.95H290M282 186.95V202.95" fill="none" stroke="#4A6273" stroke-width=".9" opacity=".75"/>
  <g fill="#2B2620" opacity=".8">
    <circle cx="282" cy="287.68" r="1.9"/>
    <circle cx="394" cy="242" r="1.5"/>
    <circle cx="170" cy="242" r="1.5"/>
  </g>
  <path d="M282 226V258M291.96 236.25L272.04 247.75M291.96 247.75L272.04 236.25" fill="none" stroke="#2B2620" stroke-width=".8" opacity=".72"/>
  <circle cx="282" cy="242" r="2.4" fill="#2B2620"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
     font-size="13" letter-spacing="1.9" fill="#2B2620" fill-opacity=".88"
     stroke="#F2EBDD" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">
    <text x="299" y="228">N POLE</text>
    <text x="293" y="190">ZENITH</text>
    <text x="291" y="305">HORIZON</text>
  </g>
</g>

<!-- paper tooth over the drawing, under the lettering -->
<rect width="880" height="588" fill="#EFE8D9" filter="url(#tooth)" opacity=".055"/>

<!-- plate frame, graduated along the left half of the top edge only -->
<g fill="none" stroke="#2B2620">
  <rect x="14" y="14" width="852" height="560" stroke-width="1.3" opacity=".78"/>
</g>
<g fill="none" stroke="#6E6558">
  <rect x="22" y="22" width="836" height="544" stroke-width=".8" opacity=".5"/>
  <path d="M34 24.5H430" stroke-width="5" stroke-dasharray="1 19.3" opacity=".38"/>
  <path d="M16 22H28M22 16V28M852 22H864M858 16V28M16 566H28M22 560V572M852 566H864M858 560V572" stroke-width=".8" opacity=".55"/>
</g>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#6E6558">

  <text x="52" y="50" font-size="13" letter-spacing="3.4">STEREOGRAPHIC PROJECTION</text>

  <text x="520" y="112" font-size="13" letter-spacing="3.4">PLATE CUT FOR BUCURESTI</text>
  <text x="520" y="134" font-size="13" letter-spacing=".6">44&#176; 25' 36" N   26&#176; 06' 09" E</text>
  <text x="520" y="154" font-size="13" letter-spacing=".6">OBLIQUITY 23&#176; 26' 21"</text>

  <text x="520" y="224" font-size="13" letter-spacing="3">FULL-STACK DEVELOPER</text>
  <text x="520" y="243" font-size="13" letter-spacing="3">IN PRODUCTION SINCE 2022</text>

  <text x="520" y="294" font-size="13" letter-spacing="3.4">CUT TO READ</text>

  <!-- construction, so the drawing can be checked against its own rule -->
  <text x="52" y="486" font-size="13" letter-spacing="1.4">ALMUCANTARS 5&#176;   AZIMUTHS 15&#176;   TWILIGHT -18&#176;</text>
  <text x="52" y="506" font-size="13" letter-spacing="1.4">COMPUTED FROM 44.4268&#176; N</text>

  <text x="52" y="546" font-size="13" letter-spacing="3.4">NOTE</text>

  <g font-size="13" letter-spacing=".2">
    <text x="520" y="338">aura-health-backend</text>
    <text x="520" y="372">Veridion-Tech-Challenge</text>
    <text x="520" y="406">Router_Simulation</text>
    <text x="520" y="440">Lexer-for-programming-language</text>
    <text x="520" y="474">TableQuery</text>
    <text x="520" y="508">ECG-RacketSport-Analysis</text>
  </g>
</g>

<g font-family="Georgia, 'Iowan Old Style', 'Liberation Serif', 'Times New Roman', Times, serif" fill="#2B2620">
  <text x="520" y="200" font-size="20" textLength="320" lengthAdjust="spacing">ADRIAN-RAZVAN RADULESCU</text>
  <g font-size="15" letter-spacing="2.2">
    <text x="520" y="322">APPOINTMENTS</text>
    <text x="520" y="356">IDENTITIES</text>
    <text x="520" y="390">PACKETS</text>
    <text x="520" y="424">TOKENS</text>
    <text x="520" y="458">TABLES</text>
    <text x="520" y="492">HEARTBEATS</text>
  </g>
  <text x="116" y="546" font-size="15" textLength="560" lengthAdjust="spacing">Everything below the horizon is still computed, you just cannot see it from here.</text>
</g>

<path d="M520 268H846" fill="none" stroke="#6E6558" stroke-width=".8" opacity=".5"/>
</svg>
