<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260">
  <defs>
    <radialGradient id="bg" cx="40%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#080818"/>
      <stop offset="100%" stop-color="#02020a"/>
    </radialGradient>
    <radialGradient id="neb1" cx="72%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#2a0845" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#02020a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="22%" cy="65%" r="35%">
      <stop offset="0%" stop-color="#041a3a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#02020a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#4a9eff" flood-opacity="0.35" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#7ab8ff" flood-opacity="0.25" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Space -->
  <rect width="860" height="260" fill="url(#bg)"/>
  <rect width="860" height="260" fill="url(#neb1)"/>
  <rect width="860" height="260" fill="url(#neb2)"/>

